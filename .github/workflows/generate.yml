name: Generate Formula & Bucket

on:
  push:
    branches: [main]
    paths: ['packages/**']
  schedule:
    - cron: '17 5 * * 1'  # Mondays at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-commits
  cancel-in-progress: false

jobs:
  generate:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Formula and Bucket
        id: render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exit_code=0
          python -u -m tribucket_gen render || exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: diff
        run: |
          git add -A -- Formula/ bucket/ packages/
          changed=$(git diff --cached --name-only -- Formula/ bucket/ packages/)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate packages before committing
        if: steps.diff.outputs.changed == 'true'
        run: python .github/scripts/validate-packages.py

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          import json, os, subprocess

          def run(*args):
              return subprocess.run(args, capture_output=True, text=True).stdout

          bucket_changes = {}   # name -> git status (A/M/D)
          formula_names = set()
          for line in run("git", "diff", "--cached", "--name-status").strip().splitlines():
              parts = line.split("\t")
              st, path = parts[0], parts[-1]
              if path.startswith("bucket/") and path.endswith(".json"):
                  bucket_changes[path[7:-5]] = st
              elif path.startswith("Formula/") and path.endswith(".rb"):
                  formula_names.add(path[8:-3])

          def version_of(name, from_head=False):
              if from_head:
                  src = run("git", "show", f"HEAD:bucket/{name}.json")
              else:
                  try:
                      src = open(f"bucket/{name}.json", encoding="utf-8").read()
                  except OSError:
                      return None
              try:
                  return json.loads(src).get("version")
              except Exception:
                  return None

          # Formula-only entries (no bucket counterpart) are listed by formula name
          display = sorted(bucket_changes)
          formula_only = [fn for fn in sorted(formula_names)
                          if fn not in bucket_changes
                          and not os.path.exists(f"bucket/{fn}.json")]
          display += formula_only

          title_names = ", ".join(display) or "definitions"
          if len(title_names) > 180:
              title_names = ", ".join(display[:6]) + f", +{len(display) - 6} more"
          title = f"chore: update Formula/Bucket ({title_names})"

          body = []
          for name in sorted(bucket_changes):
              st = bucket_changes[name]
              old, new = version_of(name, from_head=True), version_of(name)
              if st == "A" or (old is None and new):
                  body.append(f"- {name}: new package (v{new})" if new else f"- {name}: new package")
              elif st == "D" or (old and new is None):
                  body.append(f"- {name}: removed")
              elif old and new and old != new:
                  body.append(f"- {name}: {old} -> {new}")
              else:
                  body.append(f"- {name}: definition update (v{new or 'n/a'})")
          for fn in formula_only:
              body.append(f"- {fn}: formula update")

          with open("commit_msg.txt", "w", encoding="utf-8") as f:
              f.write(title + "\n\n" + "\n".join(body) + "\n")
          PY
          git commit -F commit_msg.txt
          rm -f commit_msg.txt
          git push origin HEAD:refs/heads/main

      - name: Sync generated commit to CNB
        if: steps.diff.outputs.changed == 'true'
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          if [[ -z "$CNB_TOKEN" ]]; then
            echo "CNB_TOKEN is unset. Skipping mirror sync."
            exit 0
          fi
          git -c credential.helper= \
            -c 'credential.helper=!f() { if [ "$1" = get ]; then printf "username=cnb\npassword=%s\n" "$CNB_TOKEN"; fi; }; f' \
            push https://cnb.cool/shisheng820/tribucket.git HEAD:refs/heads/main

      - name: Report render failures
        if: ${{ !cancelled() && steps.render.outputs.exit_code != '' && steps.render.outputs.exit_code != '0' }}
        env:
          RENDER_EXIT_CODE: ${{ steps.render.outputs.exit_code }}
        run: |
          echo "::error::Package render exited with status $RENDER_EXIT_CODE. See its summary for failed packages."
          exit "$RENDER_EXIT_CODE"
